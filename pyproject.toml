[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-robust-two-qubit-gate-control"
version = "0.1.0"
description = "Feedback-driven reinforcement learning for two-qubit gate calibration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyYAML>=6", "gymnasium>=0.29"]

[project.optional-dependencies]
train = ["torch>=2.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: small end-to-end training and evaluation test"]
